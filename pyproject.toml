[project]
name = "qbittorrent-poc"
version = "0.0.1"
description = "Proof of concept for the qBittorrent WebUI API (v5.x), with an MCP server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "python-dotenv>=1.0",
    "mcp>=2.3",
]

[project.scripts]
qbittorrent-mcp = "qbittorrent_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qbittorrent_poc", "src/qbittorrent_mcp"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
